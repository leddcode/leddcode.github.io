<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="icon" type="image/x-icon" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
	<title>Leddcode Portfolio</title>
</head>
<body>
	<canvas id="matrix-canvas"></canvas>
	<canvas id="starfield-canvas"></canvas>
    <div id="app-container">
        <div id="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-header">EXPLORER</div>
                <div class="file-tree">
                    <div class="tree-item"><span class="tree-icon">📄</span> about.sh</div>
                    <div class="tree-item"><span class="tree-icon">📄</span> aranea.py</div>
                    <div class="tree-item"><span class="tree-icon">📄</span> band.py</div>
                    <div class="tree-item"><span class="tree-icon">📄</span> commands.txt</div>
                    <div class="tree-item"><span class="tree-icon">📄</span> diablob.py</div>
                    <div class="tree-item"><span class="tree-icon">📄</span> everything.txt</div>
                    <div class="tree-item"><span class="tree-icon">📄</span> glazgo.exe</div>
                    <div class="tree-item"><span class="tree-icon">📄</span> oculus.py</div>
                    <div class="tree-item"><span class="tree-icon">📄</span> taxi.py</div>
                    <div class="tree-item"><span class="tree-icon">📄</span> trophy.html</div>
                    <div class="tree-item"><span class="tree-icon">📄</span> unalienable.py</div>
                    <div class="tree-item"><span class="tree-icon">📄</span> xsstrike.py</div>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-header">SYSTEM STATUS</div>
                <div class="sys-stats">
                    <div class="stat-row"><span>CPU:</span><span class="stat-val good">12%</span></div>
                    <div class="stat-row"><span>MEM:</span><span class="stat-val warn">64%</span></div>
                    <div class="stat-row"><span>NET:</span><span class="stat-val good">Online</span></div>
                    <div class="stat-row"><span>UPLINK:</span><span class="stat-val good">Active</span></div>
                </div>
            </div>
        </div>
        <div id="main-content">
            <div id="top-bar">
                <div class="tab active" data-target="terminal"><span class="tab-icon">⚙️</span> terminal</div>
                <div class="tab" data-target="metrics"><span class="tab-icon">📊</span> metrics</div>
                <div class="tab" data-target="network"><span class="tab-icon">🌐</span> network</div>
                <div class="tab-spacer"></div>
                <div class="window-controls">
                    <div class="control min"></div>
                    <div class="control max"></div>
                    <div class="control close"></div>
                </div>
            </div>
            <div id="tab-contents">
                <div id="terminal" class="tab-content active">
                    <div id="results"></div>
                    <div id="line">
                        <div id="prompt"><span class="user">leddcode</span> <span class="arrow">❯</span></div>
                        <input type="text" id="command-line" autofocus>
                    </div>
                </div>
                <div id="metrics" class="tab-content" >
                    <h2>System Metrics</h2>
                    <div id="metrics-data"></div>
                </div>
                <div id="network" class="tab-content" >
                    <h2>Network Monitor</h2>
                    <div id="network-data"></div>
                </div>
            </div>
        </div>
    </div>
	<script src="script.js"></script>
</body>
</html>
